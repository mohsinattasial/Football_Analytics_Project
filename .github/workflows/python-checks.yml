name: Football analytics smoke test

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -r Football_Analytics_Project/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q Football_Analytics_Project
      - name: Run full chart script with headless backend
        run: |
          cd Football_Analytics_Project
          MPLBACKEND=Agg python main.py
